  const sectionsEl = document.getElementById('essay-sections');
  const categories = [...new Set(essays.map(e => e.category))];
  categories.forEach(cat => {
    const heading = document.createElement('h2');
    heading.className = 'section-heading';
    heading.textContent = cat;
    sectionsEl.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'essay-list';
    essays.filter(e => e.category === cat).forEach(e => {
      const a = document.createElement('a');
      a.href = '#' + e.slug;
      a.className = 'essay-row';
      a.innerHTML = `
        <div class="meta"><span>${e.date}</span><span>${e.read} read</span></div>
        <h2>${e.title}</h2>
        <p class="dek">${e.dek}</p>
      `;
      list.appendChild(a);
    });
    sectionsEl.appendChild(list);
  });

  document.getElementById('year').textContent = new Date().getFullYear();

  function renderEssay(slug){
    const e = essays.find(x => x.slug === slug);
    if(!e) return go('home');
    document.getElementById('e-date').textContent = e.date;
    document.getElementById('e-read').textContent = e.read + ' read';
    document.getElementById('e-title').textContent = e.title;
    document.getElementById('e-dek').textContent = e.dek;
    const body = document.getElementById('e-body');
    body.innerHTML = e.placeholder === false
      ? ''
      : '<span class="placeholder-flag">Placeholder — replace with your essay text</span>';
    e.body.forEach(p => {
      const isDrop = p.startsWith('drop|');
      const text = isDrop ? p.slice(5) : p;
      const para = document.createElement('p');
      if(isDrop) para.className = 'drop';
      para.textContent = text;
      body.appendChild(para);
    });
  }

  function go(view){
    if(view === 'home'){
      window.location.hash = '';
    }
    render();
    window.scrollTo(0,0);
  }

  function render(){
    const hash = window.location.hash.replace('#','');
    const isEssay = hash && essays.some(e => e.slug === hash);
    document.querySelector('[data-view="home"]').classList.toggle('active', !isEssay);
    document.querySelector('[data-view="essay"]').classList.toggle('active', isEssay);
    if(isEssay) renderEssay(hash);
  }

  window.addEventListener('hashchange', render);
  render();

  // Theme toggle (persists per-viewer via localStorage; falls back gracefully)
  function applyTheme(t){
    if(t){ document.documentElement.setAttribute('data-theme', t); }
    else { document.documentElement.removeAttribute('data-theme'); }
    document.getElementById('theme-toggle').textContent = (t === 'dark') ? '☀' : '☾';
  }
  function toggleTheme(){
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('theme', next); }catch(err){}
  }
  (function initTheme(){
    let saved = null;
    try{ saved = localStorage.getItem('theme'); }catch(err){}
    if(saved) applyTheme(saved);
  })();
</script>

</body>
</html>
