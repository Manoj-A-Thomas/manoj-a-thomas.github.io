      body: [
        "drop|This question I had asked myself, was not the result of any transcendent urging. It was a comment of Oscar Wilde I had come across years ago that prompted it. In his characteristic style Oscar Wilde had said \u201cmost people are other people, their passions a quotation, their lives a mimicry.\u201d This enigmatic comment made me ask myself how much of me is actually mine, how much has been acquired from elsewhere.",
        "Scientists tell us that we are mainly the product of our genes. It is the genes that make us who we are and what we are. This is certainly true to a large extent. In my family, my daughter, my grandchildren, and two of my great grandchildren are left-handed. This was a gift handed down to them from my mother - their great great grandmother. She herself must have received it from some distant ancestor! We owe most of our traits to some ancestor or other.",
        "Certain diseases persist in families and trouble generation after generation, we certainly have to thank our past generations for this ubiquitous gift. It is true that we owe so much to our heredity, but our genes alone do not shape our identity. There are so many other factors that contribute to what we call \u201courselves\u201d, the most important among them are the influences we are exposed to right from our childhood. From the time of birth, a child is exposed to influences that shape its character and personality. Children, like blotting papers, absorb everything around them. The parents, of course, are the greatest influencers. In early childhood, their words, their manners, their attitudes are the forces that shape their early days. Jonathan Swift once remarked that if a child is placed under someone's influence for the first five years of life, no one will be able to change them afterward. Yes, the early years are the formative years of one life. Initially, it is the parents who influence children the most. They absorb so much from them. They are the role models, but as the world gradually opens up, the child is flooded by influences from all around. The school and college years are the major moulding factors in early life. The teachers often play a big role in the making of the students. Most students admire their teachers and this admiration often leads to imitation. The friends around them, the book they reads, the people they interact with - all have a role in the formation of their \u201cself\u201d. We end up as the patchwork of everything we have seen, heard, read.",
        "Imitation is regarded as the best form of admiration. We tend to imitate what we admire. It is a good trait, but very few people realise that it has to be exercised with discretion. Indiscriminate imitation can have disastrous results. This is true, especially in the case of fashion. All of us have a penchant for admiring what is elegant or beautiful, and this often make us imitate people who are elegant and beautiful. In the heyday of her life as the First Lady of the United States, Jacqueline Kennedy was the cynosure of the whole world. Everywhere she went, she drew large crowds. Her looks, her dresses, her hairstyle - everything won accolades. This admiration naturally resulted in endless imitations. I remember reading an article in the Reader\u2019s Digest about her popularity and the blind admiration she drew. There was a cartoon of ladies who imitated her style, but unfortunately, what suited the tall beautiful Jacqueline looked ridiculous on these women who copied her - copied her sleek hairstyle, her severely cut straight dresses, and there were fat Jacquelines, dumpy Jacquelines, lean ones, and tall ones. Obviously, what was sauce for the goose certainly was not sauce for the gander. The desire to imitate should be exercised with caution. Otherwise, we will end up as laughing stocks!!",
        "I often wonder why people imitate and copy others so easily, why most of us simply echo views and opinions borrowed from elsewhere. Mental laziness must be the main reason for this tendency. We find students turning to learning aides and such devices to find answers for mathematical problems or difficult questions. They take the easy way out, instead of trying to find answers through their own efforts. In these days of Google and Information Technology, most students lift everything from these sources and present it as their work. Originality and effort fly out of their mental windows, copying and secondhand information take their place. Nowadays, this is the norm rather than the exception. The same mental laziness and aversion for intellectual exercise often lead us to accept other people\u2019s views and opinions as gospel truth, and we parade these borrowed views proudly as our own. Everything that is popular, everything that is in vogue, will be accepted and copied by the majority of people; they are the purveyors of secondhand views, opinions, and emotions. From time to time, cults or political theories or particular intellectual views become popular, and people blindly accept them and follow them. In the 60s, when the hippie cult made its appearance, everyone tried to be a hippie. All the eccentric views, attitudes, beliefs, and behavioral patterns that we see around are blindly followed by most people. No wonder, Oscar Wilde felt that most people are indeed other people, just carbon copies in mind and manner.",
        "But, I do not want to believe that this is the whole truth. Oscar Wilde had qualified his observation through the word \u201cmost\u201d. He did not say \u201call\u201d, he left out a small minority from the classification. If all of us were copycats living on secondhand opinions and secondhand views, the world would have come to a standstill long back; thankfully, there are people who refuse to tow the popular line and the universally accepted views blindly. Every age, every country has produced people who are trailblazers, who look around, examine and question the popular views, opinions, and beliefs, and chart out a new path for themselves. They discover new ethics, new philosophies, and new ideas, which help mankind to move forward. Socrates, Plato Aristotle, Cicero, Seneca, Voltaire, Rousseau, Foucault, Derrida - these are some of the great trailblazers who stand apart from the herd and enriched us through their original thoughts and ideas. Through the vedas, the Upanishads, the Bhagawat Gita, Indian philosophers, and the Rishis have given so much insight into the human life and have delved deep into the meaning and purpose of life. We owe so much to these great souls who have chosen a different path.",
        "Very often, when a new concept or idea is broached by somebody who thinks differently, the whole world turns against them. Everyone wants to go along the beaten path. They are afraid of change. The person who comes up with a new concept or new philosophy is made to pay a heavy price. Jesus Christ, one of the greatest revolutionary thinkers the world has seen, ended up on the cross; Socrates had to take poison; Mahatma Gandhi, the apostle of non-violence was shot dead.",
        "Very often, after they are gone, their ideas are accepted, but they are completely distorted in the hands of their followers. Christ championed the cause of the poor, the suffering and the oppressed; but his followers have made him the head of a church that gives more care for its material possessions than for his teachings, though they pay lip service to it. How much of Gandhi\u2019s teachings are followed by the people who think of him as the Father of the Nation?",
        "What was original, what was path breaking and revolutionary are distorted and debased by the people who call themselves the followers of these trailblazers! I wonder, whether Karl Marx will recognize the Communism that is practiced as the manifestation of his ideas in \u2018Das Kapital\u2019. Jesus Christ will hardly recognize the Christianity that is practiced in his name. The only bright spot in this dark scenario is that in spite of the distortions, in spite of the ugly makeovers, new ideas come all the time, breathing fresh air into the stale worn out mind of humanity.",
        "In the last few centuries, there has been tremendous progress in the field of science. We have harnessed science to change the world around us. This change is a manifested, both materially as well as intellectually. What was done laboriously and manually, is now done quickly and easily by machines. This is seen in every aspect of life around us. Now-a-days, physical labor is reduced to the minimum, cutting and hoeing, digging and delving are things of the past. Inside the home, gadgets do everything for us; a homemaker\u2019s labour is reduced to the minimum. This is true not only in the case of physical labour, but also mental labour. In the past, there were so many things a student had to memorise at school, like the multiplication table. Memorising was a major aspect of learning, but all that has changed in the 20th and 21st centuries; first came Information Technology and computers, which revolutionized our lives. Pen and paper almost disappeared - laptops and computers forced them out. There was no need to memorize the multiplication table anymore; calculators where there to save us. Smart phones are there to guide us at every step. When in doubt, ask the Google has become almost the norm. And now, the latest incarnation, the all powerful AI or artificial intelligence has taken over our lives. With the coming of AI, it seems we can put our minds to sleep and forget about thinking out things or solving problems. When in a dilemma, consult some appropriate AI device - do not torture your mind with \u201cifs\u201d and \u201cwhys\u201d - that is the latest trend. At present, with Generative AI, we can get guidance about so many things. It helps us to find answers, generate pictures, and can perform so many things for us.",
        "Of course, Generative AI plays a big role in our lives now, but Generative AI has been pushed to the back background by the latest entr\u00e9e, which is Agentic AI. It can perform endless wonders. If a chatbot is developed in the field of customer service, the customer will get proper information about the product, as well as help in completing the deal. Another service of Agentic AI is in analyzing the information in hundreds of books and research papers and providing new formulae, especially in the field of chemicals and pharmaceutics. It can even help in the field of medical diagnosis by analysing various test details. The greatest role of Agentic AI is that it can take over the decision-making capacity and guide our activities and decisions. It can be a blessing, especially for people who find it difficult to make up their minds and who suffer from the \u201cto be or not to be\u201d syndrome; but it is not an unmixed blessing - it has its flipside also. If Agentic AI ends up completely dominating our lives, it will lead to the gradual decline of our cognitive powers. When somebody can solve all our problems and needs, why trouble our brains about them? One can only think of Aldous Huxley\u2019s Brave New World or George Orwell\u2019s 1984. Dr. Faustus gave up his soul to Mephistopheles for 50 years of power and glory. We are the modern Dr. Faustuses, who have pledged our hearts and souls to science and its various products. Nowadays, it is AI that dominates and controls our lives. It is the latter day Mephistopheles of the human race, if it gets total sway over us. But, even the darkest cloud darkest cloud has a silver lining; our hope lies in the minority who stand apart from the crowd, who refused to tow the accepted ways and conventions, and follow their own bent. They will never be happy with secondhand views and opinions. As long as they are there, there is hope for humanity because they are not other people, their thoughts will never be quotations, their lives will never be mimicries. Like Abuo Ben Adhem\u2019s - may their tribe increase and flourish."

        "drop|Most people in their twilight years suffer from the delusion that, it is time for them to throw in the towel, they are already over the hill. Physical constraints make them feel that, life has nothing more to offer. How ridiculous it is to presume that just because you have spells of breathlessness, just because your legs refuse to take you, where you want to go, just because you are in what Shakespeare calls the six stage of life, \"with spectacles down the nose and in slippered pantaloons\", you don't have to assume that the curtain is already down.",

        "drop|This seems to be the guiding philosophy of life at present. \"Keep a thing for seven years, then you will find a use for it.\"- my mother used to din these words into my ears. She would never throw off anything, not even the jute strings with which the packets were tied. She would untie the parcel carefully, and wind the string and keep it safely in the bag allotted for used strings, ribbons went into a different bag, twines, left over bits of coloured clothes, all had their separate places in her chest of drawers. The coloured clothes went into the making of patch work, quilts, table clothes or cushion covers. She never had to search for an elastic band or pin or any of the things, people like me search for, at the last moment. But then it was before the era of globalisation or liberalization. Money was not that plentiful, foreign goods were rare commodities, some relative from beyond the seas would bring exotic brands of powder or cream or perfume which were treasured like precious antiques. If you wanted foreign made goods you had to pay through the nose and that through, circuitous routes. Ordinary people seldom ventured into such dangerous terrain. They had to make do with desi brands of foreign brands made in India. Ponds, Cuticura, Lakme – these were the familiar cosmetic names.",
        "Those were also days when everybody knew the meaning of thrift. You had to make do with your old fridge or old car till it finally conked out. A second-hand car was the dream of every person who had a moderate income. In those days, a young man with a reasonable income dreamt of a second-hand car and the familiar models were Fiat, Standard Ten or an Ambassador. For them, the first mode of transport was often a cycle, then they would get promoted to a bike or a scooter, a car was the final point of arrival. How things have changed! Every Tom, Dick and Harry has a bike. No electrician, or carpenter or plumber worth his salt goes round in a cycle anymore. Their mode of transport is a bike and many of them have a car at home which they take out on special occasions. Now the roads are choke - a - block with luxurious, exotic models which are the owners' pride and neighbours' envy. Unless you have a BMW or Audi or a Mercedes, you have not arrived yet. When you have one of these luxury models, the next target is to own one of the super luxury ones. The BMW owner dreams of a Bentley or a Lamborghini - the costlier, the better.",

  function renderEssay(slug){
    const e = essays.find(x => x.slug === slug);
    if(!e) return go('home');
    document.getElementById('e-date').textContent = e.date;
    document.getElementById('e-read').textContent = e.read + ' read';
    document.getElementById('e-title').textContent = e.title;
    document.getElementById('e-dek').textContent = e.dek;
    const body = document.getElementById('e-body');
    body.innerHTML = e.placeholder === false
      ? ''
      : '<span class="placeholder-flag">Placeholder — replace with your essay text</span>';
    e.body.forEach(p => {
      const isDrop = p.startsWith('drop|');
      const text = isDrop ? p.slice(5) : p;
      const para = document.createElement('p');
      if(isDrop) para.className = 'drop';
      para.textContent = text;
      body.appendChild(para);
    });
  }

  function go(view){
    if(view === 'home'){
      window.location.hash = '';
    }
    render();
    window.scrollTo(0,0);
  }

  function render(){
    const hash = window.location.hash.replace('#','');
    const isEssay = hash && essays.some(e => e.slug === hash);
    document.querySelector('[data-view="home"]').classList.toggle('active', !isEssay);
    document.querySelector('[data-view="essay"]').classList.toggle('active', isEssay);
    if(isEssay) renderEssay(hash);
  }

  window.addEventListener('hashchange', render);
  render();

  // Theme toggle (persists per-viewer via localStorage; falls back gracefully)
  function applyTheme(t){
    if(t){ document.documentElement.setAttribute('data-theme', t); }
    else { document.documentElement.removeAttribute('data-theme'); }
    document.getElementById('theme-toggle').textContent = (t === 'dark') ? '☀' : '☾';
  }
  function toggleTheme(){
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('theme', next); }catch(err){}
  }
  (function initTheme(){
    let saved = null;
    try{ saved = localStorage.getItem('theme'); }catch(err){}
    if(saved) applyTheme(saved);
  })();
