<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prof Lilly Cherian — Essays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAFAF6;
    --paper-raised: #F3F1EA;
    --ink: #1C1B18;
    --ink-soft: #57534A;
    --ink-faint: #8B8578;
    --rule: #DEDACC;
    --accent: #2E4A5E;
    --accent-soft: #5C7A8C;
    --focus: #2E4A5E;
    --serif-line: 1.75;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #16150F;
      --paper-raised: #1D1C15;
      --ink: #ECE7D9;
      --ink-soft: #B3AC98;
      --ink-faint: #786F5C;
      --rule: #35331F;
      --accent: #8FB4C9;
      --accent-soft: #6C93A8;
      --focus: #8FB4C9;
    }
  }
  :root[data-theme="dark"]{
    --paper: #16150F;
    --paper-raised: #1D1C15;
    --ink: #ECE7D9;
    --ink-soft: #B3AC98;
    --ink-faint: #786F5C;
    --rule: #35331F;
    --accent: #8FB4C9;
    --accent-soft: #6C93A8;
    --focus: #8FB4C9;
  }

  *{ box-sizing: border-box; }
  html{ background: var(--paper); }
  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    line-height: var(--serif-line);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a{ color: inherit; }
  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--focus);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .sans{ font-family: "Inter", -apple-system, system-ui, sans-serif; }

  .shell{
    max-width: 720px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* ---------- Header ---------- */
  header.site{
    padding: 64px 0 40px;
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 24px;
  }
  header.site .wordmark{
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    color: var(--ink);
    font-family: "Source Serif 4", serif;
    font-style: italic;
  }
  header.site nav{
    display: flex;
    align-items: center;
    gap: 22px;
  }
  header.site nav a, header.site nav button{
    font-family: "Inter", sans-serif;
    font-size: 0.82rem;
    color: var(--ink-soft);
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    letter-spacing: 0.01em;
  }
  header.site nav a:hover, header.site nav button:hover{ color: var(--ink); }

  #theme-toggle{
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
  }

  /* ---------- Home ---------- */
  .intro{
    padding: 48px 0 8px;
    max-width: 58ch;
    text-align: center;
    margin: 0 auto;
  }
  .intro p{
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--ink);
    margin: 0;
  }
  .intro .byline{
    font-family: "Inter", sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--ink-soft);
    margin-top: 14px;
  }
  .intro-photo-wrap{
    display: inline-block;
    position: relative;
    margin: 0 auto 26px;
    transform: rotate(-4deg);
  }
  .intro-photo{
    display: block;
    width: 132px;
    height: auto;
    box-shadow: 0 10px 24px -8px rgba(28,27,24,0.28);
    border-radius: 1px;
  }
  .intro-photo-wrap::after{
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, transparent 52%, var(--paper) 100%);
    pointer-events: none;
  }

  .section-heading{
    font-style: normal;
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0;
    padding-top: 56px;
  }
  .section-heading:first-of-type{ padding-top: 8px; }

  .essay-list{
    margin: 24px 0 64px;
  }
  .essay-row{
    display: block;
    padding: 30px 0;
    border-top: 1px solid var(--rule);
    text-decoration: none;
    color: var(--ink);
  }
  .essay-list .essay-row:last-child{
    border-bottom: 1px solid var(--rule);
  }
  .essay-row .meta{
    font-family: "Inter", sans-serif;
    font-size: 0.76rem;
    color: var(--ink-faint);
    display: flex;
    gap: 14px;
    margin-bottom: 10px;
  }
  .essay-row h2{
    font-size: 1.4rem;
    font-weight: 500;
    margin: 0 0 8px;
    line-height: 1.35;
    transition: color 0.15s ease;
  }
  .essay-row:hover h2{ color: var(--accent); }
  .essay-row .dek{
    font-size: 1rem;
    color: var(--ink-soft);
    margin: 0;
    max-width: 56ch;
  }

  footer.site{
    padding: 30px 0 72px;
    border-top: 1px solid var(--rule);
    font-family: "Inter", sans-serif;
    font-size: 0.78rem;
    color: var(--ink-faint);
  }

  /* ---------- Essay page ---------- */
  .essay-header{
    padding: 56px 0 0;
  }
  .back-link{
    font-family: "Inter", sans-serif;
    font-size: 0.8rem;
    color: var(--ink-faint);
    text-decoration: none;
    display: inline-block;
    margin-bottom: 30px;
  }
  .back-link:hover{ color: var(--accent); }

  .essay-header .meta{
    font-family: "Inter", sans-serif;
    font-size: 0.78rem;
    color: var(--ink-faint);
    display: flex;
    gap: 14px;
    margin-bottom: 18px;
  }
  .essay-header h1{
    font-size: 2.15rem;
    line-height: 1.25;
    font-weight: 500;
    margin: 0 0 20px;
    max-width: 20ch;
  }
  .essay-header .dek{
    font-size: 1.2rem;
    color: var(--ink-soft);
    max-width: 42ch;
    margin: 0 0 48px;
  }

  .essay-body{
    padding-bottom: 100px;
    max-width: 64ch;
  }
  .essay-body p{
    font-size: 1.1rem;
    margin: 0 0 26px;
  }
  .essay-body p.drop::first-letter{
    font-size: 3.4rem;
    float: left;
    line-height: 0.8;
    padding: 6px 10px 0 0;
    font-weight: 500;
    color: var(--accent);
  }
  .placeholder-flag{
    font-family: "Inter", sans-serif;
    font-size: 0.72rem;
    color: var(--accent-soft);
    border: 1px solid var(--rule);
    background: var(--paper-raised);
    display: inline-block;
    padding: 3px 9px;
    border-radius: 3px;
    margin-bottom: 34px;
  }

  [data-view]{ display: none; }
  [data-view].active{ display: block; }

  @media (max-width: 560px){
    header.site{ padding: 44px 0 32px; flex-wrap: wrap; }
    .essay-header h1{ font-size: 1.7rem; }
    .intro{ padding-top: 32px; }
  }
</style>
</head>
<body>

<div class="shell">
  <header class="site">
    <nav>
      <button id="theme-toggle" aria-label="Toggle dark mode" onclick="toggleTheme()">☾</button>
    </nav>
  </header>

  <!-- HOME -->
  <main data-view="home" class="active">
    <div class="intro">
      <span class="intro-photo-wrap">
        <img class="intro-photo" src="./blob/flower.jpeg" alt="Roses in an amber glass vase on Professor Cherian's desk">
      </span>
      <p>My Essays on Life, Literature, and Everything else.</p>
      <p class="byline">—Professor Lilly Cherian</p>
    </div>

    <div id="essay-sections"></div>

    <footer class="site">
      © <span id="year"></span> · Built as a place to stimulate thinking.
    </footer>
  </main>

  <!-- ESSAY -->
  <main data-view="essay">
    <div class="essay-header">
      <a class="back-link" href="#" onclick="go('home'); return false;">← All Essays</a>
      <div class="meta">
        <span id="e-date"></span>
        <span id="e-read"></span>
      </div>
      <h1 id="e-title"></h1>
      <p class="dek" id="e-dek"></p>
    </div>
    <div class="essay-body" id="e-body"></div>
  </main>
</div>

<script>
  const essays = [
    {
      slug: "use-and-throw",
      category: "Assorted Musings",
      title: "Use and Throw",
      dek: "Disposability was sold to us as convenience. It's worth asking what habit of mind comes bundled with the product.",
      date: "Draft",
      read: "5 min",
      body: [
        "drop|This is placeholder text — replace it with your own essay. Somewhere along the way, throwing things away stopped being a last resort and became the default plan. The disposable cup, the disposable relationship, the disposable job — the logic of use-and-discard has quietly spread well past the products it was invented for.",
        "It's tempting to blame convenience culture and leave it there, but the deeper question is what disposability trains us to expect from things and from each other: that repair is not worth the effort, that replacement is always one click away.",
        "None of this is an argument for keeping everything. It's an argument for noticing when 'this isn't worth fixing' has become a reflex rather than a judgment."
      ]
    },
    {
      slug: "the-best-is-yet-to-be",
      category: "Assorted Musings",
      title: "The Best Is Yet to Be",
      dek: "A line borrowed often enough to become a cliché, and true often enough to keep being borrowed.",
      date: "Draft",
      read: "4 min",
      body: [
        "drop|This is placeholder text — replace it with your own essay. There's a particular kind of optimism that isn't naive so much as stubborn — the sense that whatever has already happened doesn't get the final word on what happens next.",
        "It's easy to mistake this for denial, especially from the outside. But holding two things at once — a clear-eyed account of what's gone wrong, and a refusal to treat that account as the ending — is not the same as pretending nothing has gone wrong.",
        "Maybe the honest version of the sentiment isn't a prediction at all. It's a decision about which way to keep facing."
      ]
    },
    {
      slug: "who-am-i",
      category: "Assorted Musings",
      title: "Who Am I?",
      dek: "The question sounds like it wants a single answer. Most of what makes it interesting is that it doesn't.",
      date: "Draft",
      read: "6 min",
      body: [
        "drop|This is placeholder text — replace it with your own essay. Asked plainly, the question resists a plain answer. A name, a job title, a nationality — each one is true and each one is clearly not the whole of it, which is usually where the more interesting thinking starts.",
        "Most of the useful answers turn out to be relational rather than essential: who someone is to their family looks different from who they are in a lecture hall, and neither version is a disguise hiding some more authentic third self underneath.",
        "Maybe the question is less a request for a definition and more an invitation to notice how many true, partial answers a person can hold without needing to resolve them into one."
      ]
    },
    {
      slug: "imitations",
      category: "Post-Modern Literary Criticisms",
      title: "Imitations",
      dek: "Every text is already a copy of something. Postmodern fiction just stopped pretending otherwise.",
      date: "Draft",
      read: "5 min",
      body: [
        "drop|This is placeholder text — replace it with your own essay. Originality was always a useful fiction, propped up by a canon that made citation look like inheritance rather than repetition. Postmodern writing tends to drop the pretense and let the borrowing show.",
        "This isn't the same as running out of ideas. An imitation that knows it's an imitation is doing something different from a failed attempt at originality — it's making the act of copying itself part of what the text is about.",
        "The uncomfortable question it leaves behind is whether any writing was ever doing anything else, or whether imitation was the condition all along and only postmodern fiction bothered to say so."
      ]
    },
    {
      slug: "metaphoric-metanymic-poles",
      category: "Post-Modern Literary Criticisms",
      title: "The Metaphoric and Metanymic Poles",
      dek: "Jakobson split language into two axes of association. Most literary movements can be read as a preference for one over the other.",
      date: "Draft",
      read: "7 min",
      body: [
        "drop|This is placeholder text — replace it with your own essay. One axis works by similarity — this stands for that because the two resemble each other. The other works by contiguity — this stands for that because the two are already next to each other, part of the same scene or sequence.",
        "Poetry has traditionally leaned toward the first, prose toward the second, but the interesting cases are the ones that refuse to sit still on either axis — a narrative built from associative leaps, or a lyric that proceeds by adjacency rather than resemblance.",
        "Reading a text for which pole it favors says less about its genre than about the kind of attention it's asking the reader to pay — likeness spotted across distance, or connection traced along a surface."
      ]
    }
  ];

  const sectionsEl = document.getElementById('essay-sections');
  const categories = [...new Set(essays.map(e => e.category))];
  categories.forEach(cat => {
    const heading = document.createElement('h2');
    heading.className = 'section-heading';
    heading.textContent = cat;
    sectionsEl.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'essay-list';
    essays.filter(e => e.category === cat).forEach(e => {
      const a = document.createElement('a');
      a.href = '#' + e.slug;
      a.className = 'essay-row';
      a.innerHTML = `
        <div class="meta"><span>${e.date}</span><span>${e.read} read</span></div>
        <h2>${e.title}</h2>
        <p class="dek">${e.dek}</p>
      `;
      list.appendChild(a);
    });
    sectionsEl.appendChild(list);
  });

  document.getElementById('year').textContent = new Date().getFullYear();

  function renderEssay(slug){
    const e = essays.find(x => x.slug === slug);
    if(!e) return go('home');
    document.getElementById('e-date').textContent = e.date;
    document.getElementById('e-read').textContent = e.read + ' read';
    document.getElementById('e-title').textContent = e.title;
    document.getElementById('e-dek').textContent = e.dek;
    const body = document.getElementById('e-body');
    body.innerHTML = '<span class="placeholder-flag">Placeholder — replace with your essay text</span>';
    e.body.forEach(p => {
      const isDrop = p.startsWith('drop|');
      const text = isDrop ? p.slice(5) : p;
      const para = document.createElement('p');
      if(isDrop) para.className = 'drop';
      para.textContent = text;
      body.appendChild(para);
    });
  }

  function go(view){
    if(view === 'home'){
      window.location.hash = '';
    }
    render();
    window.scrollTo(0,0);
  }

  function render(){
    const hash = window.location.hash.replace('#','');
    const isEssay = hash && essays.some(e => e.slug === hash);
    document.querySelector('[data-view="home"]').classList.toggle('active', !isEssay);
    document.querySelector('[data-view="essay"]').classList.toggle('active', isEssay);
    if(isEssay) renderEssay(hash);
  }

  window.addEventListener('hashchange', render);
  render();

  // Theme toggle (persists per-viewer via localStorage; falls back gracefully)
  function applyTheme(t){
    if(t){ document.documentElement.setAttribute('data-theme', t); }
    else { document.documentElement.removeAttribute('data-theme'); }
    document.getElementById('theme-toggle').textContent = (t === 'dark') ? '☀' : '☾';
  }
  function toggleTheme(){
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('theme', next); }catch(err){}
  }
  (function initTheme(){
    let saved = null;
    try{ saved = localStorage.getItem('theme'); }catch(err){}
    if(saved) applyTheme(saved);
  })();
</script>

</body>
</html>
